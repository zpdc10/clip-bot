[project]
name = "clipbot"
version = "0.1.0"
description = "Turn exported gaming clips into vertical YouTube Shorts"
requires-python = ">=3.11"
dependencies = [
    "wordninja>=2.0",
    "anthropic>=2.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipbot = "clipbot.main:main"

[tool.setuptools]
packages = ["clipbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
